[package]
name = "noending"
version = "0.1.0"
description = "NoEnding — Conversations end. Context doesn't."
authors = ["NoEnding"]
edition = "2021"
# `src/bin/*` eval tools are secondary binaries; `cargo run` (and therefore
# `tauri dev`) must keep resolving to the app binary without --bin.
default-run = "noending"

[lib]
name = "noending"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled", "functions"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
dirs = "5"
thiserror = "2"

[profile.release]
lto = true
strip = true
