name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-and-frontend:
    name: ${{ matrix.os }} · cargo + frontend
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      # Windows-only cfg branches are never compiled on a macOS dev machine;
      # both targets must build continuously.
      - name: cargo check
        run: cargo check --all-targets

      - name: cargo test
        run: cargo test --all-targets

      # 方案 §44.5: a red `cargo test` must not hide whether the frontend still
      # builds. Both jobs on `395066e` skipped these two steps and reported
      # nothing about them; the job still fails on the Rust step above.
      - name: frontend install
        if: always()
        working-directory: .
        run: pnpm install --frozen-lockfile

      - name: frontend build
        if: always()
        working-directory: .
        run: pnpm build

      # 方案 §14: the Settings discovery contract (mount never spawns a CLI,
      # Refresh is the only entry, overrides survive failures) is locked by
      # vitest and must gate both platforms like the Rust suite does.
      - name: frontend test
        if: always()
        working-directory: .
        run: pnpm test
